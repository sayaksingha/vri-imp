//---------------------------------------------------------------
// TOTAL NUMBER OF NODES TO MONITOR
//---------------------------------------------------------------
TOTAL_NODES_IN_CLUSTER = 1

// **************************************************************/
// IF TOTAL_NODES_IN_CLUSTER = N , THEN  YOU  HAVE TO READ ALL 'N'
// NUM OF NODES AND THE SYSTAX IS: CLUSTER_NODE_1 = NODE_NAME1:IP,
// CLUSTER_NODE_2 = NODE_NAME2:IP, CLUSTER_NODE_3 = NODE_NAME3:IP,
// AND SO ON ... TILL CLUSTER_NODE_N = NODE_NAMEN:IP ADDRESS.
// **************************************************************/

//---------------------------------------------------------------
// CLUSTER_NODE_1 = NODE_NAME1:IP ADDRESS
//---------------------------------------------------------------
CLUSTER_NODE_1 = HA-1:10.0.3.232

//---------------------------------------------------------------
// This Config value is read by LogHandler to write logs into files or
// DB based on the value is 0 or 1.
// 0 -> DB not installed, 1 -> DB Installed
// Default : 1
//---------------------------------------------------------------
DB_INSTALLED = 0

//---------------------------------------------------------------
// This config value is read by OAM Processes.
// This config value tells whether to use Oracle/My-Sql DB Client
// 0 -> Oracle, 1 -> MySql
// Default : 0
//---------------------------------------------------------------
OAM_DB_CLIENT = 0

//---------------------------------------------------------------
// This Config value is used by LogApi to create shared memory for Pegs.
// 0 -> Pegs not required 1 -> Pegs are required
// NOTE: This is a mandatory param.If not configured
// Log obj init in all the processes will fail.
// No Default value
//---------------------------------------------------------------
PEGS_REQD = 0

/////////////////////////////////////////////////////////////////
//             CDR UPLOAD/DOWNLAOD                             //
/////////////////////////////////////////////////////////////////

//---------------------------------------------------------------
// This parameter specifies total no. of location(Sites), where USSD is installed.
// If CDRs need not be deleted from Database, this parameter can be assgined a value
// (no. of location + 1). 
// Range  : Min 1 Max 30
// Default: No Default Value is considered.
// Change : The value can be changed using signal 10.
//---------------------------------------------------------------
TOTAL_NO_OF_LOCATIONS           = 2

//---------------------------------------------------------------
// CRITICAL parameter
// Each Location, where USSD is installed, is assigned a unique Location Id
// This parameter specifies the unique location id.
// Make sure the same Location Id is not assigned to some other site, it will affect the
// consistency of CDR's.
// Range   : Min 1 Max 30
// Default : No Default Value is considered.
// Change  : The value can be changed using signal 10.
//---------------------------------------------------------------
THIS_LOCATION_ID = 1

//---------------------------------------------------------------
// This parameter specifies the Column on which consolidated CDRs should be sorted on. 
// Range : Min 1 Max 10 
// Default : None 
// Change : The value can be changed using signal 10. 
//---------------------------------------------------------------
CDR_GENERATION_TIME_COLUMN = 5

//---------------------------------------------------------------
// This parameter sets the amount of information to be logged
// If 0 Ussd-G/W will generate all Failure logs with few important logs.
// if 1 Ussd-G/W will generate all Failure and Success logs.
// No Default Value is considered.
// The value can be changed using signal 10.
//---------------------------------------------------------------
ALL_LOGS_REQ = 1

//---------------------------------------------------------------------------------------------
// This parameter sets the amount of information to be logged
// If 0 generate all Failure logs with few important logs.
// if 1 generate all Failure and Success logs.
// if 2 generate all Failure and detailed Success logs.
// No Default Value is considered.
// The value can be changed using signal 10.
//---------------------------------------------------------------------------------------------
LOG_LEVEL = 1

//---------------------------------------------------------------------------------------------
// Generate the License key for the installed machine and paste it here.
//---------------------------------------------------------------------------------------------
LICENSE_KEY = 54b93a2805181d9e5b3639cfef077acc

//---------------------------------------------------------------------------------------------
//For CMS integrated OAM
//---------------------------------------------------------------------------------------------
LOG_GROUP_ID_ivr=1
LOG_GROUP_ID_OAM=1
LOG_TO_SOCKET=0
//---------------------------------------------------------------------------------------------
LOG_RECORDS_PER_FILE=1000000
EXECUTE_LOG_TRAP_SCRIPT=1
LOG_SEVERITY=5

PRODUCT_ID=1

