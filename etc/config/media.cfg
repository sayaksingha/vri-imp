// DESCRIPTION
//   This file contains the Media-Card(Synway) configuration parameters.
//
// Originated : CHETHAN                                      03-MAR-2011
//----------------------------------------------------------------------
//----------------------------------------------------------------------
// This parameter specifies whether to send media-card activity response
//  back to applictaion or not.
//  (media-card activity is different from the events on media-card) 
// Range   : Not Required - 0, Required - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
MEDIA_SEND_RSP_FLAG = 0

//----------------------------------------------------------------------
//This Paramater specifies the Link Status File Path for Synway 
// signaling links.
// Range   : 1 TO 200 Chars 
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
SYNWAY_LINK_STATUS_LOG_FILE=/opt/ivr/var/log

//----------------------------------------------------------------------
// This parameter specifies Play File Format
// Value                              Encoding Format
//  -2                                    PCM16
//   1                                    PCM8
//   6                                    A-law
//   7                                    u-law
//   17                                   IAM-ADPCM
//   23                                   VOX
//   49                                   GSM
//   85                                   MP3
//   131                                  GC8
//   65411                                G.729A
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
SYNWAY_PLAY_VOICE_FILE_FORMAT = -2 

//----------------------------------------------------------------------
// This parameter specifies Play File Format
// Value                              Encoding Format
//  -2                                    PCM16
//   1                                    PCM8
//   6                                    A-law
//   7                                    u-law
//   17                                   IAM-ADPCM
//   23                                   VOX
//   49                                   GSM
//   85                                   MP3
//   131                                  GC8
//   65411                                G.729A
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
SYNWAY_RECORD_VOICE_FILE_FORMAT = -2

//----------------------------------------------------------------------
// This parameter specifies Maximum Wait for Wait to Occur
// Range   : 1 - 4000000
//   Note 4000000 means unlimited
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
SYNWAY_TIME_OUT_FOR_WAIT_EVENT = 4000000 

//----------------------------------------------------------------------
// This parameter specifies Maximum Channel per process
// Range   : 1 - 1000
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
MAX_CHANNEL_PER_PROCESS = 240

//----------------------------------------------------------------------
// This parameter specifies To Run Signalling or Not
// Range   : 0 - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
RUN_SYNWAY_SIGNALLING_THREAD = 1

//----------------------------------------------------------------------
// This parameter specifies To Run Channel Management Thread or Not
// Range   : 0 - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
RUN_SYNWAY_CHANNEL_MGMT_THREAD = 1

//----------------------------------------------------------------------
// This parameter specifies The Link Status Log file path
// Range   : 
// Default : None
// Change  : 
//----------------------------------------------------------------------
SYNWAY_LINK_STATUS_LOG_FILE=/opt/ivr/var/log

//----------------------------------------------------------------------
// This parameter specifies the play file progress check interval
// Range   :
// Default : None
// Change  : 
//----------------------------------------------------------------------
SYNWAY_FILE_PLAY_PROGRESS_CHECK_INETRVAL = 60

//----------------------------------------------------------------------
// This parameter specifies the record file progress check interval
// Range   :
// Default : None
// Change  : 
//----------------------------------------------------------------------
SYNWAY_FILE_RECORD_PROGRESS_CHECK_INETRVAL = 60

//----------------------------------------------------------------------
// This parameter specifies the maximum call duration
// Range   :1 - 30 (in minute)
// Default : None
// Change  :
//----------------------------------------------------------------------
SYNWAY_MAX_CALL_DURATION = 5 //Value in minute

//----------------------------------------------------------------------
// This parameter specifies To Run Dialogic ISDN signalling
// Range   : 0 - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
DIALOGIC_ISDN_CALL_HANDLE = 1

//----------------------------------------------------------------------
// This parameter specifies To Run Dialogic Channel Management Thread
// Range   : 0 - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
DIALOGIC_CHANNEL_MGMT_THREAD = 0

//----------------------------------------------------------------------
// This parameter specifies Outgoing Call Wait Time 
// Range : 10 - 600
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
DIALOGIC_OUTGOING_CALL_WAIT_TIME = 120


