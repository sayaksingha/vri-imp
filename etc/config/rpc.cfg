########################################################################
#  Connection Details for RPC Request Client Module                    #
########################################################################

//---------------------------------------------------------------
// This parameter specifies Total Number of Voice server connections to 
//  to be established, Second Server is considered as standby server.
// Range   : 1 - 2
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
NO_OF_RPC_REQ_SERVERS = 1

//---------------------------------------------------------------
// This parameter specifies Voice Server connection Names.
// This should be as much as the count given in NO_OF_RPC_REQ_SERVERS
// Length  : 1 - 20
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
RPC_REQ_SERVERS = RPC1

//---------------------------------------------------------------
// XXX_IP
// This parameter specifies the IP Address of The RPC Server
// Value : Valid IPv4 IP address
// Default : None
// Change : The value can not be changed at runtime.
//
// XXX_PORT
// This parameter specifies the Port Number of The RPC Server
// Range   : 100 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//
// XXX_SESSION_ID
// This parameter specifies the Session Id of the connection
// Range   : 11 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
RPC1_IP             = 10.0.3.221   
RPC1_PORT           = 40014      
RPC1_SESSION_ID     = 12345 


########################################################################
#  Connection Details for RPC Request Server Module                    #
########################################################################
//---------------------------------------------------------------
// This parameter specifies the Port Number of The RPC Server
// Range   : 100 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
RPC_REQ_SVC_PORT    = 40014   


########################################################################
#  Connection Details for RPC Response Client Module                   #
########################################################################
//---------------------------------------------------------------
// This parameter specifies Total Number of Appl. server connections to 
//  to be established, Second Server is considered as standby server.
// Range   : 1 - 2
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
NO_OF_APPLICATION_RPC_RSP_SERVERS = 1

//---------------------------------------------------------------
// This parameter specifies Appl. Server connection Names.
// This should match the count given in NO_OF_APPLICATION_RPC_RSP_SERVERS
// Length  : 1 - 20
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
APPLICATION_RPC_RSP_SERVERS = IVR1

//---------------------------------------------------------------
// XXX_IP
// This parameter specifies the IP Address of The RPC Rsp. Server
// Value : Valid IPv4 IP address
// Default : None
// Change : The value can not be changed at runtime.
//
// XXX_PORT
// This parameter specifies the Port Number of The RPC Rsp. Server
// Range   : 100 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//
// XXX_SESSION_ID
// This parameter specifies the Session Id of the connection
// Range   : 11 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
IVR1_IP             = 172.20.0.204
IVR1_PORT           = 50016 
IVR1_SESSION_ID     = 12345


########################################################################
#  Connection Details for RPC Response Server Module                   #
########################################################################
//---------------------------------------------------------------
// This parameter specifies the Port Number of The RPC Response Server
// Range   : 100 - 100000
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
RPC_RSP_SERVER_PORT    = 50016 

########################################################################
###################  General Account Configuration  ####################
########################################################################
//---------------------------------------------------------------
// This parameter specifies the Connection Retry interval. (In Seconds)
// if connection to Voice Server is down, when next automatic connection 
//  Retry Attempt is to be mode
// Range   : 1 - 3600
// Default : Default is 10 seconds
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
IVR_CONNECT_RETRY_TIMER_TIMEOUT = 5 

//---------------------------------------------------------------
// This parameter specifies the Number of Connection Retry Attempts
// Range   : 1 - 10
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
IVR_RETRY_ATTEMPTS              = 50    

