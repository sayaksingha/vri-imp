//---------------------------------------------------------------
// This parameter specifies the Signalling Protocol to be used
// Range   : ISUP - 1 SIP - 2
// Default : None
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
PROTOCOL_TYPE = 1

//---------------------------------------------------------------
// This parameter specifies the total circuit config in IVR
// Range   : 1 - 1024
// Type    : Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
//IVR_TOTAL_CKTS=240

//---------------------------------------------------------------
// This parameter specifies the incoming circuit config of IVR
// Range   : 1 - 1024
// Type    : Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
//IVR_IN_CKTS=1,120

//---------------------------------------------------------------
// This parameter specifies the outcoming circuit config of IVR
// Range   : 1 - 1024
// Type    : Non Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
//IVR_OUT_CKTS=121,240

//---------------------------------------------------------------
// This parameter specifies the pattern based on which the file type can
// be identified as HTTP
// Range   :
// Type    : Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
HTTP_FILE_PATTERNS=http,HTTPI

//---------------------------------------------------------------
// This parameter specifies the pattern based on which the file type can
// be identified as STREAM 
// Range   :
// Type    : Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
STREAM_FILE_PATTERNS=RTS,RTSP

//---------------------------------------------------------------
// This parameter specifies the maximum number of channels per 
//  process, used by Synway Media Process.
// Range   : 1 - 1024
// Type    : Mandatory Param
// Change  : The value can not be changed at runtime.
//---------------------------------------------------------------
MAX_CHANNEL_PER_PROCESS=120

//----------------------------------------------------------------------
// This config value is read by IVR Processes.
// This config value tells whether to use Oracle/My-Sql DB Client
// 0 -> Oracle, 1 -> MySql
// Default : 0
//----------------------------------------------------------------------
IVR_DB_CLIENT=0

//----------------------------------------------------------------------
// This config value is read by MMP Processes.
// This config value tells whether to use Oracle/My-Sql DB Client
// 0 -> Oracle, 1 -> MySql
// Default : 0
//----------------------------------------------------------------------
MMP_DB_CLIENT=1

//---------------------------------------------------------------
// This parameter specifies the vxml request time delay 
// Range   : 1 - 60000000
// Type    : Mandatory Param
// Change  : The value can be changed at runtime.
//---------------------------------------------------------------
IVR_VXML_REQ_DELAY_TIME=1000000

