//----------------------------------------------------------------------
// How to --------------------------------------------------------------
// The format for entry in this config file is as follows
// TRACENAME=TraceLevel:TraceFileName
//
// TRACENAME is the name given while creating the Trace object
// ex Ctrace xyz(TRACENAME);
// TraceLevel is the  desired trace level
//                     0  disable all trace
//                    -1  Enable error trace       (all TERR)
//                    -2  Enable error and detail  (TERR and T_DETAIL)
//                     1  Enable trace             (T and TERR)
//                     2  Enable Trace and Detail  (T, TERR and T_DETAIL)
//                     Other values treated as default which will be 1
//                     No values given all trace will be disabled
// TraceFileName is the file in which the traces are to be logged
// This is optional if not given the tracefile is created with TRACENAME
// Default   : All traces disabled
// On Change : CbkTrace will effect change.
// How to --------------------------------------------------------------

// The trace name for various processes are given below

//----------------------------------------------------------------------
// SIP Kernel Process
//----------------------------------------------------------------------
TRACE_SIP_HDLR = 1:IvrSip
