//----------------------------------------------------------------------
// NAME           : SIP_LICENSE
// DESCRIPTION    : This param decides number of parallel calls allowed
// MIN            : 1
// MAX            : 1000
// DEFAULT        : MANDATORY
// Process        : ACU_SipHandler
// TYPE           : Non-Reloadable
//----------------------------------------------------------------------
SIP_LICENSE=4

//----------------------------------------------------------------------
// This parameter specifies Format of wave file to play
// Values  :
// --------- TiNG 2 Ver ---------------------------
// kSMDataFormat8KHzPCM ((enum kSMDataFormat) 1)
// kSMDataFormat8KHzALawPCM ((enum kSMDataFormat) 8)
// kSMDataFormat8KHzULawPCM ((enum kSMDataFormat) 7)
// kSMDataFormat8KHzOKIADPCM ((enum kSMDataFormat) 2)
// kSMDataFormat8KHzACUBLKPCM ((enum kSMDataFormat) 3)
// kSMDataFormat6KHzPCM ((enum kSMDataFormat) 4)
// kSMDataFormat6KHzALawPCM ((enum kSMDataFormat) 18)
// kSMDataFormat6KHzULawPCM ((enum kSMDataFormat) 19)
// kSMDataFormat6KHzOKIADPCM ((enum kSMDataFormat) 5)
// kSMDataFormat6KHzACUBLKPCM ((enum kSMDataFormat) 6)
// kSMDataFormatCELP8KBPS ((enum kSMDataFormat) 9)
// kSMDataFormat8KHz16bitMono ((enum kSMDataFormat) 14)
// kSMDataFormat8KHz8bitMono ((enum kSMDataFormat) 15)
// kSMDataFormat8KHzSigned8bitMono ((enum kSMDataFormat) 20)

// --------- TiNG 3 Ver ---------------------------
// kSMDataFormatNone = 0
//kSMDataFormat8KHzALawPCM    kSMDataFormatALawPCM    8000 = 30
//kSMDataFormat8KHzULawPCM    kSMDataFormatULawPCM    8000 = 31
//kSMDataFormat8KHzOKIADPCM   kSMDataFormatOKIADPCM   8000 = 32
//kSMDataFormat8KHzACUBLKPCM  kSMDataFormatACUBLKPCM  8000 = 33
//kSMDataFormat6KHzALawPCM    kSMDataFormatALawPCM    6000 = 30
//kSMDataFormat6KHzULawPCM    kSMDataFormatULawPCM    6000 = 31
//kSMDataFormat6KHzOKIADPCM   kSMDataFormatOKIADPCM   6000 = 32
//kSMDataFormat6KHzACUBLKPCM  kSMDataFormatACUBLKPCM  6000 = 33
//kSMDataFormat8KHz16bitMono  kSMDataFormat16bit   8000 = 34
//kSMDataFormat8KHz8bitMono   kSMDataFormat8bit    8000 = 35
//kSMDataFormat8KHzSigned8bitMono   kSMDataFormatSigned8bit 8000 = 36
//kSMDataFormatIMAADPCM    kSMDataFormatIMAADPCM   8000 = 17
// ------------------------------------
// Default : None
// Change  : The value can be changed at runtime.
//----------------------------------------------------------------------
MEDIA_FILE_FORMAT=14

//----------------------------------------------------------------------
// NAME           : SIP_TIMER_TABLE_SIZE
// DESCRIPTION    : Timer hash table size
// MIN            : 1
// MAX            : 20000
// DEFAULT        : MANDATORY
// Process        : ACU_SipHandler
// TYPE           : Non-Reloadable
//----------------------------------------------------------------------
SIP_TIMER_TABLE_SIZE=2000

//----------------------------------------------------------------------
// NAME           : SIP_TIMEOUT_Q_LIMIT
// DESCRIPTION    : Timer hash table Q limit
// MIN            : 1
// MAX            : 10000
// DEFAULT        : MANDATORY
// Process        : ACU_SipHandler
// TYPE           : Non-Reloadable
//----------------------------------------------------------------------
SIP_TIMEOUT_Q_LIMIT=1000

//----------------------------------------------------------------------
// NAME           : SIP_TIMER_RANDOM_TIMEOUT
// DESCRIPTION    : Timer hash table random timeout
// MIN            : 5
// MAX            : 3600
// DEFAULT        : MANDATORY
// Process        : ACU_SipHandler
// TYPE           : Non-Reloadable
//----------------------------------------------------------------------
SIP_TIMER_RANDOM_TIMEOUT=6

