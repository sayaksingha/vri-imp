// DESCRIPTION
//   This file contains the Media-Card(Synway) configuration parameters.
//
// Originated : ROOPA A M                                    20-MAR-2013
//----------------------------------------------------------------------
//----------------------------------------------------------------------
// This parameter specifies whether to send media-card activity response
// back to applictaion or not.
// (media-card activity is different from the events on media-card)
// Range   : Not Required - 0, Required - 1
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
MEDIA_SEND_RSP_FLAG = 0

//----------------------------------------------------------------------
// This parameter specifies the type of companding type for Media Card
// during media activities.
// Range   : ALAW - 1, MLAW - 2
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
COMPANDING_TYPE = 1

//----------------------------------------------------------------------
// This parameter specifies the number of ACULAB cards to use
// for media process.
// Change  : The value can be changed at runtime.
//----------------------------------------------------------------------
NUM_OF_ACU_CARDS = 1

//----------------------------------------------------------------------
// This parameter enables the Media (Play/Rec/Dtmf/Fax/Conf) traces
// for media process.
// Change  : The value can be changed at runtime.
//----------------------------------------------------------------------
MEDIA_TRACE = 5

//----------------------------------------------------------------------
// This parameter enables the TiNG Trace internal API traces 
// Value   : 1 - Disable
//           2 - Debug
//           3 - Enable All
// Change  : The value can be changed at runtime.
//----------------------------------------------------------------------
TING_TRACE = 1

//----------------------------------------------------------------------
// This parameter specifies Maximum Channel per process
// Range   : 1 - 1000
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
MAX_CHANNEL_PER_PROCESS = 240

//----------------------------------------------------------------------
// This parameter specifies Maximum Number of DSP's supported for Card
// Range   : 1 - 8
// Default : None
// Change  : The value can not be changed at runtime.
//----------------------------------------------------------------------
ACU_NUM_DSP_PER_CARD = 4

//----------------------------------------------------------------------
