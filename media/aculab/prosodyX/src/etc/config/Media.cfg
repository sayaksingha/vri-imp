ACU_FILE_FORMAT =  14  // kSMDataFormat16bit

//----------------------------------------------------------------------
// This parameter specifies skip time for Forward/Rewind of Play
// Values   : in seconds
// Data/sec : 21712 offsets
//----------------------------------------------------------------------
ACU_PLAY_SKIP_TIME = 1 
